[project]
name = "backend"
version = "0.1.0"
description = "API + model klasifikasi fase permainan catur (opening/middlegame/endgame)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pandas>=3.0.6",
    "python-chess>=1.999",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
